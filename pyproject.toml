[project]
name = "ruuvigate"
version = "1.0.5"
description = "Python package to publish RuuviTag data to cloud"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jan Lipponen", email = "jan.lipponen@gmail.com" },
]
keywords = ["RuuviTag"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ruuvitag-sensor>=2.0.0,<3.0.0",
    "azure-iot-device>=2.12.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
]


[dependency-groups]
dev = [
    "pytest>=7.2.1,<8.0.0",
    "pytest-asyncio>=0.20.3,<0.21.0",
    "yapf>=0.40.2,<0.41.0",
    "mypy>=1.8.0,<2.0.0",
    "types-PyYAML>=6.0.12.12,<7.0.0.0",
]

[project.urls]
Repository = "https://github.com/jlipponen/RuuviGate"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ruuvigate"]

[tool.yapfignore]
ignore_patterns = [
    "tests/**",
    ".venv/**"
]

[tool.mypy]
python_version = 3.12
exclude = "tests"
